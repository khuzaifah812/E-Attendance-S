<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UICT-ESAS - Error</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f9ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .error-container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        .error-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .error-container h1 {
            color: #c62828;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .error-container p {
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #43a047;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 500;
            transition: background 0.3s;
        }
        .btn:hover { background: #2e7d32; }
        @media (max-width: 480px) {
            .error-container { padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">⚠️</div>
        <h1>Something Went Wrong</h1>
        <p>{{ message|default:"An unexpected error occurred. Please try again." }}</p>
        <a href="{% url 'dashboard' %}" class="btn">Go to Dashboard</a>
    </div>
</body>
</html>
