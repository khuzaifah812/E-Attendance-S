<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UICT-ESAS - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            padding: 50px;
            width: 100%;
            max-width: 440px;
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: #2e7d32; font-size: 28px; font-weight: 700; }
        .logo p { color: #666; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .form-group input:focus {
            border-color: #43a047;
            outline: none;
            box-shadow: 0 0 0 3px rgba(67, 160, 71, 0.1);
        }
        
        /* Password input with show/hide toggle */
        .password-wrapper {
            position: relative;
            width: 100%;
        }
        .password-wrapper input {
            width: 100%;
            padding: 12px 50px 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .password-wrapper input:focus {
            border-color: #43a047;
            outline: none;
            box-shadow: 0 0 0 3px rgba(67, 160, 71, 0.1);
        }
        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #888;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.3s;
        }
        .toggle-password:hover {
            color: #2e7d32;
            background: #f0f0f0;
        }
        .toggle-password:focus {
            outline: none;
        }
        .toggle-password .eye-icon {
            font-size: 20px;
            line-height: 1;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #43a047;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-login:hover { background: #2e7d32; }
        
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .alert-error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }
        .alert-success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }
        .alert-info {
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #90caf9;
        }
        
        .demo-credentials {
            margin-top: 25px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
            font-size: 13px;
            color: #555;
        }
        .demo-credentials strong { color: #2e7d32; }
        .demo-credentials code {
            background: #e0e0e0;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
        
        /* Password strength indicator (optional) */
        .password-hint {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        
        @media (max-width: 480px) {
            .login-container { padding: 30px 20px; }
            .logo h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>📚 UICT-ESAS</h1>
            <p>UICT E-Attendance System</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility" title="Show/Hide password">
                        <span class="eye-icon" id="eyeIcon">👁️</span>
                    </button>
                </div>
                <div class="password-hint">
                    <span id="capsLockWarning" style="display: none; color: #f9a825;">⚠️ Caps Lock is ON</span>
                </div>
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>

        <!-- Demo Credentials Section (for development/testing) -->
        
        <div class="footer">&copy; 2025 UICT - All Rights Reserved</div>
    </div>

    <script>
        (function() {
            'use strict';

            // Get elements
            const passwordInput = document.getElementById('password');
            const toggleButton = document.getElementById('togglePassword');
            const eyeIcon = document.getElementById('eyeIcon');
            const capsLockWarning = document.getElementById('capsLockWarning');

            // Toggle password visibility
            toggleButton.addEventListener('click', function() {
                const isPasswordVisible = passwordInput.getAttribute('type') === 'text';
                
                // Toggle input type
                if (isPasswordVisible) {
                    passwordInput.setAttribute('type', 'password');
                    eyeIcon.textContent = '👁️';
                    toggleButton.setAttribute('aria-label', 'Show password');
                    toggleButton.title = 'Show password';
                } else {
                    passwordInput.setAttribute('type', 'text');
                    eyeIcon.textContent = '🙈';
                    toggleButton.setAttribute('aria-label', 'Hide password');
                    toggleButton.title = 'Hide password';
                }
            });

            // Caps Lock detection
            passwordInput.addEventListener('keydown', function(e) {
                const key = e.key;
                if (key === 'CapsLock') {
                    // Toggle caps lock warning when CapsLock key is pressed
                    const isCapsLockOn = e.getModifierState('CapsLock');
                    capsLockWarning.style.display = isCapsLockOn ? 'inline' : 'none';
                }
            });

            passwordInput.addEventListener('keyup', function(e) {
                const isCapsLockOn = e.getModifierState('CapsLock');
                capsLockWarning.style.display = isCapsLockOn ? 'inline' : 'none';
            });

            // Check caps lock state on focus
            passwordInput.addEventListener('focus', function(e) {
                const isCapsLockOn = e.getModifierState('CapsLock');
                capsLockWarning.style.display = isCapsLockOn ? 'inline' : 'none';
            });

            // Hide caps lock warning on blur
            passwordInput.addEventListener('blur', function() {
                capsLockWarning.style.display = 'none';
            });

            // Allow pressing Enter to submit the form
            passwordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    document.querySelector('form').submit();
                }
            });

            // Also allow Enter on username field
            document.getElementById('username').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    document.querySelector('form').submit();
                }
            });

            console.log('🔐 Login page loaded with show/hide password functionality');
        })();
    </script>
</body>
</html>
